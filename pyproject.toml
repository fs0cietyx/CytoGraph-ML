[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cytograph-ml"
version = "1.0.0"
description = "Leakage-aware explainable machine learning framework for transcriptomic cancer classification."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "requests",
    "mygene",
    "GEOparse",
    "xgboost",
    "lightgbm",
    "shap",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
